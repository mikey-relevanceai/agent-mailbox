[package]
name = "mailbox-stub-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference stub adapter: publishes a synthetic event on an interval to exercise the mailbox protocol, wake, cursors, and fan-out"

# The reference adapter is a standalone binary. It speaks ONLY `mailbox-protocol`
# (NDJSON on stdout) and NEVER links the `mailbox` bridge crate — adapters never
# import bridge internals (ADR-0001). The bin name is what the bridge's stub
# resolver looks for on PATH (and what `MAILBOX_STUB_ADAPTER_BIN` overrides).
[[bin]]
name = "mailbox-stub-adapter"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mailbox-protocol = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# current-thread runtime is plenty: one interval timer + signal handlers + async
# stdout (io-std/io-util) so a backpressured write never wedges a clean shutdown.
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "signal", "io-std", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"
