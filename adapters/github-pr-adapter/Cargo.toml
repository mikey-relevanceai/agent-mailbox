[package]
name = "mailbox-github-pr-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GitHub PR poll adapter: shells out to `gh`, publishes only the transitions agents care about (conflict / reviews / CI), with an edge-triggered baseline persisted via the bridge"

# The real MVP adapter. It speaks ONLY `mailbox-protocol` (NDJSON on stdout) and
# NEVER links the `mailbox` bridge crate — adapters never import bridge internals
# (ADR-0001). It reaches GitHub by shelling out to `gh` (overridable via
# `MAILBOX_GH_BIN` so tests point it at a fake). The bin name is what the bridge's
# github-pr resolver looks for on PATH (and what `MAILBOX_GH_ADAPTER_BIN`
# overrides).
[[bin]]
name = "mailbox-github-pr-adapter"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mailbox-protocol = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# current-thread runtime: one poll timer + signal handlers + async stdout, plus
# `process` to shell out to `gh` without blocking the runtime thread.
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "signal", "io-std", "io-util", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"
