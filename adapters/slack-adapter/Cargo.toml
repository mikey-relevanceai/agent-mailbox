[package]
name = "mailbox-slack-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Slack poll adapter: watches one channel's top level or one thread, publishes each new message, with an edge-triggered baseline persisted via the bridge"

# Speaks ONLY `mailbox-protocol` (NDJSON on stdout) and never links the `mailbox`
# bridge crate (ADR-0001). It reaches Slack by shelling out to `curl`
# (`MAILBOX_SLACK_CURL_BIN` for tests) and reads its token from the macOS Keychain
# through `security` (`MAILBOX_SLACK_SECURITY_BIN` for tests) — ADR-0027. The bin
# name is what the bridge's Slack resolver looks for (`MAILBOX_SLACK_ADAPTER_BIN`
# overrides it).
[[bin]]
name = "mailbox-slack-adapter"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mailbox-protocol = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# current-thread runtime: one poll timer + signal handlers + async stdout, plus
# `process` to shell out to `curl` and `security` without blocking the runtime.
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "signal", "io-std", "io-util", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"
