[package]
name = "mailbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent mailbox bridge CLI — durable topics, subscriptions, and wake kicks"

[[bin]]
name = "mailbox"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mailbox-protocol = { workspace = true }
mailbox-harness = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal"] }
tracing = "0.1.44"
thiserror = "2.0.18"
serde_json = "1.0.150"
nix = { version = "0.31.3", features = ["fs", "poll"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.103"

[dev-dependencies]
tempfile = "3.27.0"
