[package]
name = "mailbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent mailbox bridge CLI — durable topics, subscriptions, and wake kicks"

[[bin]]
name = "mailbox"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mailbox-protocol = { workspace = true }
mailbox-harness = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"
thiserror = "2.0.18"
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
