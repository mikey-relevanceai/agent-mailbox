[package]
name = "mailbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent mailbox bridge CLI — durable topics, subscriptions, and idle-agent wake"
# Two bin targets exist (the real CLI + a test-only adapter fixture), so name the
# one `cargo run -p mailbox` should default to. Keeps the documented
# `cargo run -p mailbox -- --help` unambiguous.
default-run = "mailbox"

[[bin]]
name = "mailbox"
path = "src/main.rs"

# TEST-ONLY child-process fixture for the adapter-host tests (card 07). It is a
# real, spawnable program because the host must be exercised against a genuine
# child; it is NOT part of the shipped CLI surface. Integration tests locate it
# via the Cargo-provided `CARGO_BIN_EXE_test_adapter` env var. The real reference
# stub adapter is a later card, not this one.
#
# NOTE: this builds as a normal artifact alongside `mailbox`, so packaging /
# release must target the real binary explicitly, e.g.
# `cargo install --path crates/mailbox --bin mailbox` (or `cargo build --release
# --bin mailbox`), so the fixture is never shipped.
[[bin]]
name = "test_adapter"
path = "tests/bin/test_adapter.rs"

[lints]
workspace = true

[dependencies]
mailbox-protocol = { workspace = true }
mailbox-harness = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal", "process"] }
tracing = "0.1.44"
thiserror = "2.0.18"
serde_json = "1.0.150"
nix = { version = "0.31.3", features = ["fs", "poll", "signal", "resource", "process"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.103"
ratatui = "0.30.2"

[dev-dependencies]
tempfile = "3.27.0"
